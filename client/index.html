<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Asesino - Multiplayer Thriller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #0a0e27;
      color: #fff;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hud-top {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid #00ff00;
    }

    .hud-bottom-right {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid #ff6600;
    }

    .health-bar {
      width: 200px;
      height: 20px;
      background: #333;
      border: 1px solid #fff;
      margin-top: 10px;
      position: relative;
      border-radius: 4px;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff00, #ffff00, #ff3300);
      width: 100%;
      border-radius: 4px;
      transition: width 0.2s;
    }

    #chat-container {
      position: absolute;
      bottom: 100px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00ff00;
      border-radius: 8px;
      width: 300px;
      height: 250px;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 12px;
    }

    #chat-input {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-top: 1px solid #00ff00;
      padding: 8px;
      font-size: 12px;
      outline: none;
    }

    .chat-message {
      margin-bottom: 8px;
      padding: 4px;
      border-left: 2px solid #00ff00;
      padding-left: 8px;
    }

    /* LOBBY */
    #lobby {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lobby-container {
      background: rgba(0, 0, 0, 0.8);
      padding: 40px;
      border-radius: 15px;
      border: 2px solid #ff3300;
      max-width: 600px;
      text-align: center;
    }

    .lobby-container h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #ff3300;
      text-shadow: 0 0 10px #ff3300;
    }

    .input-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      text-align: left;
      font-weight: bold;
      color: #00ff00;
    }

    input, select {
      padding: 10px;
      background: #1a1a2e;
      border: 1px solid #00ff00;
      color: #fff;
      border-radius: 5px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #ff3300;
      box-shadow: 0 0 10px #ff3300;
    }

    button {
      padding: 12px 30px;
      background: #ff3300;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      pointer-events: auto;
    }

    button:hover {
      background: #ff5500;
      box-shadow: 0 0 15px #ff3300;
      transform: scale(1.05);
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .player-list {
      background: rgba(30, 30, 50, 0.8);
      border: 1px solid #00ff00;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
    }

    .player-item {
      padding: 8px;
      border-left: 3px solid #00ff00;
      margin-bottom: 5px;
      padding-left: 10px;
    }

    .waiting {
      color: #ffff00;
      font-style: italic;
    }

    /* PARANOIA EFFECTS */
    .paranoia-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 0, 0, 0.3);
      font-size: 24px;
      pointer-events: none;
      animation: paranoia-pulse 1s infinite;
    }

    @keyframes paranoia-pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }

    .wound-indicator {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      animation: wound-crawl 2s infinite;
    }

    @keyframes wound-crawl {
      0%, 100% { transform: translateX(-50%) scaleY(0.9); }
      50% { transform: translateX(-50%) scaleY(1.1); }
    }

    /* GAME OVER */
    #game-over {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .game-over-content {
      text-align: center;
      padding: 40px;
    }

    .game-over-content h1 {
      font-size: 64px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px currentColor;
    }

    .win {
      color: #00ff00;
    }

    .lose {
      color: #ff3300;
    }
  </style>
</head>
<body>
  <div id="lobby">
    <div class="lobby-container">
      <h1>🔪 JUEGO ASESINO 🔪</h1>
      <p style="margin-bottom: 20px; color: #aaa;">Psychological Thriller Multiplayer</p>

      <div class="input-group">
        <label for="username">Tu Nombre:</label>
        <input type="text" id="username" placeholder="Ingresa tu nombre" />
      </div>

      <div class="input-group">
        <label for="character">Personaje:</label>
        <select id="character">
          <option value="">-- Elegir Personaje --</option>
          <option value="1">Lord Arthur Sterling</option>
          <option value="2">Lady Evelyn Thorne</option>
          <option value="3">Dr. Alistair Vance</option>
          <option value="4">Madame Blanche DuBois</option>
          <option value="5">Coronel Reginald Pike</option>
          <option value="6">Madame Cassandra</option>
          <option value="7">Sra. Margaret Croft</option>
          <option value="8">Thomas Pendelton</option>
          <option value="9">Scarlet Monet</option>
          <option value="10">Prof. Julian Wright</option>
          <option value="11">Silas Thorne</option>
          <option value="12">Clara Higgins</option>
        </select>
      </div>

      <div class="input-group">
        <label for="map">Mapa:</label>
        <select id="map">
          <option value="times-square">Times Square (NYC)</option>
          <option value="blue-mosque">Mezquita Azul (Estambul)</option>
          <option value="plaza-mayor">Plaza Mayor (Madrid)</option>
          <option value="edinburgh-castle">Castillo de Edimburgo</option>
          <option value="la-boca">La Boca (Buenos Aires)</option>
        </select>
      </div>

      <button id="join-btn">UNIRSE A LA SALA</button>

      <div class="player-list" id="player-list">
        <p class="waiting">Esperando jugadores...</p>
      </div>

      <button id="start-btn" style="margin-top: 15px; display: none;">INICIAR JUEGO</button>
    </div>
  </div>

  <div id="hud" style="display: none;">
    <div class="hud-top">
      <div>Jugadores vivos: <span id="player-count">0</span>/12</div>
      <div>Mapa: <span id="map-name">Times Square</span></div>
      <div>Rol: <span id="role-display" style="color: #ffff00;">Inocente</span></div>
      <div style="margin-top: 10px;">
        <div>Salud:</div>
        <div class="health-bar">
          <div class="health-fill" id="health-fill" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <div class="hud-bottom-right">
      <div>Arma: <span id="weapon-display">Puños</span></div>
      <div>Munición: <span id="ammo-display">∞</span></div>
      <div style="margin-top: 10px; font-size: 12px;">
        <div>WASD - Moverse</div>
        <div>MOUSE - Mirar</div>
        <div>ESPACIO - Correr</div>
        <div>E - Cambiar Vista</div>
        <div>CLICK - Atacar</div>
        <div>T - Chat</div>
      </div>
    </div>

    <div id="chat-container">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Escribe tu mensaje... (Enter para enviar)">
    </div>
  </div>

  <div id="game-over">
    <div class="game-over-content">
      <h1 id="game-over-title" class="win">¡GANASTE!</h1>
      <p id="game-over-message" style="font-size: 20px; margin-bottom: 30px;"></p>
      <button onclick="location.reload()">VOLVER AL LOBBY</button>
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  
  <!-- Game Scripts -->
  <script src="js/constants.js"></script>
  <script src="js/audio-system.js"></script>
  <script src="js/hud-system.js"></script>
  <script src="js/network.js"></script>
  <script src="js/player-controller.js"></script>
  <script src="js/paranoia-effects.js"></script>
  <script src="js/scene-manager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
